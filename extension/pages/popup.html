<!DOCTYPE html>
<html lang="zh-Hant" data-mdr="popup">
<head>
<meta charset="utf-8">
<title>MD隨手讀</title>
<link rel="stylesheet" href="../styles/reader.css">
<link rel="stylesheet" href="../styles/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="pp">
  <header class="pp-head">
    <img src="../icons/icon32.png" width="24" height="24" alt="">
    <span class="pp-name">MD隨手讀</span>
    <span class="pp-ver" id="version"></span>
  </header>

  <div class="pp-warn" id="warn" hidden>
    <span class="mdr-icon" data-icon="warning" aria-hidden="true"></span>
    <span>還沒開「檔案權限」,看不了電腦裡的 .md。<button type="button" class="mdr-btn-text mdr-ix" id="fix-access">去開啟</button></span>
  </div>

  <div class="pp-drive" id="drive" hidden></div>

  <button type="button" class="mdr-btn-primary mdr-ix pp-wide" id="open-file">
    <span class="mdr-icon" data-icon="folder_open" aria-hidden="true"></span>開啟電腦裡的 .md
  </button>
  <p class="pp-hint"><span class="mdr-icon" data-icon="lightbulb" aria-hidden="true"></span>也可以直接把 .md 檔拖進任何 Chrome 分頁</p>

  <form id="paste-form" class="pp-paste">
    <textarea id="paste" rows="3" placeholder="貼上 Markdown 文字或網址…" aria-label="貼上 Markdown 文字或網址"></textarea>
    <button type="submit" class="mdr-btn mdr-ix pp-wide" id="paste-go" disabled>
      <span class="mdr-icon" data-icon="content_paste" aria-hidden="true"></span>排版給我看
      <span class="mdr-icon pp-go" data-icon="arrow_forward" aria-hidden="true"></span>
    </button>
  </form>

  <section class="pp-recent">
    <div class="pp-label"><span class="mdr-icon" data-icon="history" aria-hidden="true"></span>最近開過</div>
    <ul id="recent"></ul>
    <p class="pp-empty" id="recent-empty" hidden></p>
  </section>

  <footer class="pp-foot">
    <button type="button" class="mdr-btn-text mdr-ix" id="open-settings"><span class="mdr-icon" data-icon="settings" aria-hidden="true"></span>設定</button>
    <button type="button" class="mdr-btn-text mdr-ix" id="open-guide"><span class="mdr-icon" data-icon="menu_book" aria-hidden="true"></span>使用說明</button>
    <button type="button" class="mdr-btn-text mdr-ix" id="open-changelog"><span class="mdr-icon" data-icon="update" aria-hidden="true"></span>更新日誌</button>
  </footer>
</div>
<script src="../core/ui.js"></script>
<script src="../core/detect.js"></script>
<script src="../core/settings.js"></script>
<script src="../core/library.js"></script>
<script src="popup.js"></script>
</body>
</html>
