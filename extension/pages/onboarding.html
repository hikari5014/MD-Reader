<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>MD隨手讀:還差一步</title>
<style>
  :root { color-scheme: light dark; --accent: #7c5cff; --line: #e3e3e3; --soft: #f6f6f6; }
  @media (prefers-color-scheme: dark) { :root { --line: #363636; --soft: #262626; } }
  body { margin: 0; font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 1.8em; margin: .2em 0; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 32px 0; }
  .step { border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .num { display: inline-flex; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 700; align-items: center; justify-content: center; }
  .status { padding: 14px 18px; border-radius: 12px; background: var(--soft); font-weight: 700; }
  .status.ok { background: #dcfce7; color: #14532d; }
  button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  code { background: var(--soft); padding: .1em .4em; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <div style="font-size:48px">🔓</div>
  <h1>還差一步,就能看電腦裡的 .md 檔!</h1>
  <p>Chrome 為了保護你的檔案,規定這個開關只能由<b>你親手打開</b>,插件沒辦法代開。</p>
  <div class="steps">
    <div class="step"><span class="num">1</span><p>按下面的按鈕,打開「MD隨手讀」的擴充功能設定頁。</p><button id="open-settings">打開設定頁</button></div>
    <div class="step"><span class="num">2</span><p>往下捲,找到<b>「允許存取檔案網址」</b>。</p></div>
    <div class="step"><span class="num">3</span><p>把開關<b>打開</b>,再回到這一頁看狀態變綠色。</p></div>
  </div>
  <p id="status" class="status">⏳ 目前狀態:尚未開啟</p>
  <p style="color:#888;font-size:14px">找不到按鈕的話,也可以在網址列輸入 <code>chrome://extensions</code>,找到「MD隨手讀」按「詳細資料」。</p>
</main>
<script src="onboarding.js"></script>
</body>
</html>
