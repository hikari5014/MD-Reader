<!DOCTYPE html>
<html lang="zh-Hant" data-mdr="onboarding">
<head>
<meta charset="utf-8">
<title>MD隨手讀:還差一步</title>
<link rel="stylesheet" href="../styles/reader.css">
<link rel="stylesheet" href="../styles/ui.css">
<style>
  html[data-mdr] body { font-size: 16px; line-height: 1.7; }
  .ob { max-width: 780px; margin: 0 auto; padding: 64px 24px; animation: mdr-rise var(--mdr-slow) var(--mdr-ease) both; }
  .ob-hero { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 22px; background: var(--mdr-accent-soft); color: var(--mdr-accent); }
  .ob-hero .mdr-icon { --mdr-icon-size: 40px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 48; animation: mdr-pop 520ms var(--mdr-ease-spring) 150ms both; }
  .ob h1 { margin: 20px 0 6px; font-size: 1.8em; }
  .ob-lead { color: var(--mdr-muted); }
  .ob-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin: 32px 0; }
  .ob-step { display: flex; flex-direction: column; gap: 10px; padding: 20px; border: 1px solid var(--mdr-line); border-radius: 18px; background: var(--mdr-bg); transition: border-color var(--mdr-med) var(--mdr-ease), transform var(--mdr-med) var(--mdr-ease), box-shadow var(--mdr-med) var(--mdr-ease); animation: mdr-rise var(--mdr-slow) var(--mdr-ease) both; }
  .ob-step:nth-child(2) { animation-delay: 80ms; }
  .ob-step:nth-child(3) { animation-delay: 160ms; }
  .ob-step:hover { border-color: color-mix(in srgb, var(--mdr-accent) 45%, var(--mdr-line)); transform: translateY(-2px); box-shadow: var(--mdr-shadow); }
  .ob-step-head { display: flex; align-items: center; gap: 10px; }
  .ob-num { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; background: var(--mdr-accent); color: #fff; font-size: 14px; font-weight: 700; }
  .ob-step-head .mdr-icon { --mdr-icon-size: 24px; color: var(--mdr-accent); }
  .ob-step p { margin: 0; }
  .ob-status { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-radius: 14px; background: var(--mdr-bg-2); font-weight: 700; transition: background-color var(--mdr-med) var(--mdr-ease), color var(--mdr-med) var(--mdr-ease); }
  .ob-status .mdr-icon { --mdr-icon-size: 22px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 20; }
  .ob-status.is-waiting .mdr-icon { animation: ob-spin 1.6s linear infinite; }
  .ob-status.is-ok { background: #dcfce7; color: #14532d; }
  .ob-status.is-ok .mdr-icon { animation: mdr-pop 420ms var(--mdr-ease-spring); }
  @keyframes ob-spin { to { transform: rotate(360deg); } }
  .ob-foot { color: var(--mdr-faint); font-size: 14px; }
  .ob-foot code { padding: 0.1em 0.4em; border-radius: 4px; background: var(--mdr-bg-2); }
</style>
</head>
<body>
<main class="ob">
  <div class="ob-hero"><span class="mdr-icon" data-icon="lock_open" aria-hidden="true"></span></div>
  <h1>還差一步,就能看電腦裡的 .md 檔!</h1>
  <p class="ob-lead">Chrome 為了保護你的檔案,規定這個開關只能由<b>你親手打開</b>,插件沒辦法代開。</p>
  <div class="ob-steps">
    <div class="ob-step">
      <div class="ob-step-head"><span class="ob-num">1</span><span class="mdr-icon" data-icon="extension" aria-hidden="true"></span></div>
      <p>按下面的按鈕,打開「MD隨手讀」的擴充功能設定頁。</p>
      <button type="button" class="mdr-btn-primary mdr-ix" id="open-settings"><span class="mdr-icon" data-icon="open_in_new" aria-hidden="true"></span>打開設定頁</button>
    </div>
    <div class="ob-step">
      <div class="ob-step-head"><span class="ob-num">2</span><span class="mdr-icon" data-icon="lock" aria-hidden="true"></span></div>
      <p>往下捲,找到<b>「允許存取檔案網址」</b>。</p>
    </div>
    <div class="ob-step">
      <div class="ob-step-head"><span class="ob-num">3</span><span class="mdr-icon" data-icon="toggle_on" aria-hidden="true"></span></div>
      <p>把開關<b>打開</b>,再回到這一頁看狀態變綠色。</p>
    </div>
  </div>
  <p id="status" class="ob-status is-waiting"><span class="mdr-icon" data-icon="refresh" aria-hidden="true"></span><span>目前狀態:尚未開啟</span></p>
  <p class="ob-foot">找不到按鈕的話,也可以在網址列輸入 <code>chrome://extensions</code>,找到「MD隨手讀」按「詳細資料」。</p>
</main>
<script src="../core/ui.js"></script>
<script src="../core/settings.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
